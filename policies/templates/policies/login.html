{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Vazirmatn', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #1a237e 0%, #0d1452 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 420px; margin: auto; width: 100%; }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo i { font-size: 3rem; color: var(--primary, #1a237e); }
        .login-logo h3 { font-weight: 800; color: var(--primary, #1a237e); margin-top: 10px; }
        .form-control { border-radius: 10px; padding: 12px 15px; }
        .btn-login { background: #1a237e; color: white; border-radius: 10px; padding: 12px; font-weight: 600; width: 100%; }
        .btn-login:hover { background: #283593; color: white; }
        .errorlist { color: #c62828; list-style: none; padding: 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-shield-alt"></i>
                <h3>حسابداری بیمه</h3>
                <p class="text-muted">سامانه مدیریت بیمه نامه‌ها</p>
            </div>
            <form method="POST">
                {% csrf_token %}
                {% if form.errors %}
                <div class="alert alert-danger">
                    نام کاربری یا رمز عبور اشتباه است.
                </div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label small">نام کاربری</label>
                    <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small">رمز عبور</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt ms-1"></i> ورود
                </button>
            </form>
        </div>
    </div>
</body>
</html>
